name: cuenca-cimarron
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      APP_NAME: Cuenca Cimarrón
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Ejecuta primero el script de inicialización}
      APP_URL: http://localhost:${WEB_PORT:-8090}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: cuenca
      DB_USERNAME: cuenca
      DB_PASSWORD: ${DB_PASSWORD:?Ejecuta primero el script de inicialización}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    ports:
      - "127.0.0.1:${API_PORT:-8091}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cuenca
      POSTGRES_USER: cuenca
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecuta primero el script de inicialización}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuenca -d cuenca"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
